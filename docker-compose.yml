version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinerec-postgres
    ports:
      - "5454:5432"
    environment:
      POSTGRES_DB: cinerec
      POSTGRES_USER: cinerec_user
      POSTGRES_PASSWORD: cinerec_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinerec_user -d cinerec"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinerec-redis
    ports:
      - "6363:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
